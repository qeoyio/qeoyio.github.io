
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boolean Battle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #10172a, #253b65);
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 550px;
      padding: 30px;
      background: #17233d;
      border: 1px solid #405579;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 45px #0005;
    }

    h1 {
      margin: 0 0 5px;
      color: #65e6c2;
      font-size: 32px;
    }

    .subtitle {
      color: #b5c3dc;
      margin-bottom: 25px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      background: #243553;
      border-radius: 12px;
      padding: 12px 5px;
      flex: 1;
      min-width: 0;
    }

    .stat span {
      display: block;
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
      color: #65e6c2;
    }

    .question-box {
      background: #0f192c;
      padding: 25px 15px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .question-label {
      color: #b5c3dc;
      font-size: 14px;
    }

    #question {
      font-size: 30px;
      color: #ffd166;
      overflow-wrap: anywhere;
      margin: 18px 0 10px;
    }

    #hint {
      color: #b5c3dc;
      font-size: 14px;
    }

    .answers {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .answer {
      flex: 1;
      color: #10172a;
    }

    .true-btn {
      background: #65e6c2;
    }

    .false-btn {
      background: #ff7b91;
    }

    #feedback {
      min-height: 48px;
      line-height: 1.5;
      color: #dce6f8;
      margin: 12px 0;
    }

    #nextBtn, #restartBtn {
      background: #668cff;
      color: white;
      width: 100%;
      margin-top: 8px;
    }

    #restartBtn {
      background: #65a9ff;
    }

    .hidden {
      display: none !important;
    }

    .progress-track {
      height: 8px;
      border-radius: 20px;
      background: #35445e;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #progress {
      height: 100%;
      width: 0%;
      background: #65e6c2;
      transition: width 0.3s;
    }

    @media (max-width: 420px) {
      .game {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }

      #question {
        font-size: 24px;
      }

      .stat span {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>⚡ Boolean Battle</h1>
    <p class="subtitle">Think fast. Choose wisely. Win the battle!</p>

    <div class="stats">
      <div class="stat">
        Score
        <span id="score">0</span>
      </div>
      <div class="stat">
        Lives
        <span id="lives">❤️❤️❤️</span>
      </div>
      <div class="stat">
        Streak
        <span id="streak">0</span>
      </div>
    </div>

    <div class="progress-track">
      <div id="progress"></div>
    </div>

    <section class="question-box">
      <div class="question-label" id="round">QUESTION 1</div>
      <h2 id="question">Preparing game...</h2>
      <p id="hint">Will the result be true or false?</p>
    </section>

    <div class="answers" id="answers">
      <button type="button" id="trueBtn" class="answer true-btn">
        TRUE ✓
      </button>
      <button type="button" id="falseBtn" class="answer false-btn">
        FALSE ✗
      </button>
    </div>

    <p id="feedback" aria-live="polite">Choose your answer!</p>

    <button type="button" id="nextBtn" class="hidden">
      Next Question →
    </button>

    <button type="button" id="restartBtn" class="hidden">
      Play Again 🔄
    </button>
  </main>

  <script>
    "use strict";

    // All questions are included in this file.
    const questions = [
      {
        expression: "true && true",
        answer: true,
        explanation: "AND (&&) is true when both values are true."
      },
      {
        expression: "true && false",
        answer: false,
        explanation: "AND (&&) needs both values to be true."
      },
      {
        expression: "true || false",
        answer: true,
        explanation: "OR (||) is true when at least one value is true."
      },
      {
        expression: "false || false",
        answer: false,
        explanation: "OR (||) is false when both values are false."
      },
      {
        expression: "!true",
        answer: false,
        explanation: "NOT (!) reverses true to false."
      },
      {
        expression: "!false",
        answer: true,
        explanation: "NOT (!) reverses false to true."
      },
      {
        expression: "5 > 3",
        answer: true,
        explanation: "Five is greater than three."
      },
      {
        expression: "10 < 4",
        answer: false,
        explanation: "Ten is not less than four."
      },
      {
        expression: "7 === 7",
        answer: true,
        explanation: "Strict equality checks whether values are equal."
      },
      {
        expression: "5 === '5'",
        answer: false,
        explanation: "Strict equality does not treat a number as a string."
      },
      {
        expression: "true && !false",
        answer: true,
        explanation: "!false is true, so both sides are true."
      },
      {
        expression: "false && true",
        answer: false,
        explanation: "AND is false if either side is false."
      },
      {
        expression: "!(true || false)",
        answer: false,
        explanation: "The OR expression is true, so NOT makes it false."
      },
      {
        expression: "8 >= 8",
        answer: true,
        explanation: "Greater than or equal includes equal values."
      },
      {
        expression: "3 !== 3",
        answer: false,
        explanation: "Three is equal to three, so !== returns false."
      },
      {
        expression: "(true || false) && true",
        answer: true,
        explanation: "The OR expression is true, and true AND true is true."
      },
      {
        expression: "4 > 9 || 2 < 5",
        answer: true,
        explanation: "The second comparison is true, so the OR is true."
      },
      {
        expression: "!(5 > 2)",
        answer: false,
        explanation: "Five is greater than two, then NOT reverses the result."
      },
      {
        expression: "10 !== '10'",
        answer: true,
        explanation: "A number and a string are different under strict inequality."
      },
      {
        expression: "(6 > 2) && (3 < 1)",
        answer: false,
        explanation: "The first comparison is true but the second is false."
      }
    ];

    let deck = [];
    let current = 0;
    let score = 0;
    let lives = 3;
    let streak = 0;
    let answered = false;

    const $ = (id) => document.getElementById(id);

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function updateStats() {
      $("score").textContent = score;
      $("lives").textContent =
        "❤️".repeat(lives) + "🖤".repeat(3 - lives);
      $("streak").textContent = streak;

      const progress = deck.length
        ? (current / deck.length) * 100
        : 0;

      $("progress").style.width = progress + "%";
    }

    function showQuestion() {
      if (current >= deck.length) {
        endGame(true);
        return;
      }

      answered = false;
      const q = deck[current];

      $("round").textContent =
        `QUESTION ${current + 1} OF ${deck.length}`;
      $("question").textContent = q.expression;
      $("hint").textContent = "Will the result be true or false?";
      $("feedback").textContent = "Choose your answer!";
      $("feedback").style.color = "#dce6f8";

      $("nextBtn").classList.add("hidden");

      document.querySelectorAll(".answer").forEach((button) => {
        button.disabled = false;
      });

      updateStats();
    }

    function checkAnswer(choice) {
      if (answered || lives <= 0) return;

      answered = true;
      const q = deck[current];

      document.querySelectorAll(".answer").forEach((button) => {
        button.disabled = true;
      });

      if (choice === q.answer) {
        score += 10;
        streak++;
        $("feedback").textContent =
          `Correct! 🎉 ${q.explanation}`;
        $("feedback").style.color = "#65e6c2";
      } else {
        lives--;
        streak = 0;
        $("feedback").textContent =
          `Incorrect! ❌ ${q.explanation}`;
        $("feedback").style.color = "#ff7b91";
      }

      updateStats();

      if (lives <= 0) {
        endGame(false);
      } else if (current === deck.length - 1) {
        endGame(true);
      } else {
        $("nextBtn").classList.remove("hidden");
      }
    }

    function nextQuestion() {
      if (!answered || lives <= 0) return;

      if (current < deck.length - 1) {
        current++;
        showQuestion();
      }
    }

    function endGame(victory) {
      $("answers").classList.add("hidden");
      $("nextBtn").classList.add("hidden");
      $("restartBtn").classList.remove("hidden");
      $("progress").style.width =
        (current / deck.length) * 100 + "%";

      $("round").textContent = "GAME FINISHED";
      $("question").textContent = victory ? "🏆 Victory!" : "💔 Game Over";

      $("hint").textContent = victory
        ? "You reached the end of Boolean Battle!"
        : "You ran out of lives. Try again!";

      $("feedback").textContent = victory
        ? `You scored ${score} points! Great work!`
        : `Final score: ${score} points. Keep practicing!`;

      $("feedback").style.color = victory ? "#65e6c2" : "#ff7b91";
    }

    function startGame() {
      deck = shuffle([...questions]);
      current = 0;
      score = 0;
      lives = 3;
      streak = 0;
      answered = false;

      $("restartBtn").classList.add("hidden");
      $("nextBtn").classList.add("hidden");
      $("answers").classList.remove("hidden");

      showQuestion();
    }

    $("trueBtn").addEventListener("click", () => checkAnswer(true));
    $("falseBtn").addEventListener("click", () => checkAnswer(false));
    $("nextBtn").addEventListener("click", nextQuestion);
    $("restartBtn").addEventListener("click", startGame);

    // Start the game.
    startGame();
  </script>
</body>
</html>
